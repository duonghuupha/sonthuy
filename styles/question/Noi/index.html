
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Plugin</title>
  <link rel="stylesheet" href="css/match-plugin.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/match-plugin.js"></script>
</head>
<body>
  <h2 style="text-align:center">🧠 Trò chơi nối hình phù hợp 🧠</h2>
  <div id="match-game" style="max-width:900px; margin:auto;"></div>
  <script>
    $('#match-game').matchImageToText({
      pairs: [
        { a: 'https://via.placeholder.com/100x80?text=A', b: 'Apple' },
        { a: 'https://via.placeholder.com/100x80?text=B', b: 'Banana' },
        { a: 'https://via.placeholder.com/100x80?text=C', b: 'Cat' }
      ],
      onCheck: function(results) {
        console.log(results);
      }
    });
  </script>
</body>
</html>
