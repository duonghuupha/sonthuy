<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chọn đề - Từ vựng</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="btnBack" class="back-btn" title="Trở về">
    <img src="assets/back.svg" alt="Back">
  </button>

  <header class="header">
    <h1>CHỌN ĐỀ THI</h1>
  </header>

  <main class="main">
    <div id="grid" class="grid"></div>
  </main>

  <footer class="pager">
    <button id="prevPage" class="nav-btn"><img src="assets/arrow-left.svg" alt="Prev"></button>
    <div class="page-indicator"><span id="pageInfo">1/1</span></div>
    <button id="nextPage" class="nav-btn"><img src="assets/arrow-right.svg" alt="Next"></button>
  </footer>

<script src="script.js"></script>
</body>
</html>
