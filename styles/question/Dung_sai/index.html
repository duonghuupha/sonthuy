<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Đúng/Sai</title>
  <link rel="stylesheet" href="quiz/quiz-style.css">
</head>
<body>
  <div id="quiz-container">Đang tải câu hỏi...</div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="quiz/quiz-plugin.js"></script>
  <script>
    $(function () {
      $.getJSON('./data/questions.json', function(data) {
        $('#quiz-container').trueFalseQuiz({
          questions: data
        });
      }).fail(function() {
        $('#quiz-container').text("Không thể tải câu hỏi. Vui lòng kiểm tra file JSON.");
      });
    });
  </script>
</body>
</html>
