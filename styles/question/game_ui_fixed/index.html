<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene Interaction - Fixed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <button class="btn-exit delay-5" title="Exit">
      <img src="assets/btn-exit.svg" alt="Exit" />
    </button>

    <div class="title delay-1">Part 1a</div>

    <div class="instruction delay-2">
      CHOOSE THE CORRECT OBJECTS IN THE SCENE PICTURE:
    </div>

    <div class="audio-bar delay-3">
      <button class="btn-play" aria-label="Play/Pause">
        <img src="assets/btn-play.svg" alt="Play" id="playIcon" />
      </button>
      <div class="progress">
        <input type="range" id="progressBar" value="0" max="100" />
        <span class="time" id="timeDisplay">00:00 / 00:00</span>
      </div>
    </div>

    <div class="scene-frame delay-4">
      <img src="assets/scene.svg" alt="Scene" class="scene-img" />
    </div>

    <button class="btn-nav left delay-5" title="Previous">
      <img src="assets/btn-left.svg" alt="Left" />
    </button>
    <button class="btn-nav right delay-5" title="Next">
      <img src="assets/btn-right.svg" alt="Right" />
    </button>
  </div>

  <audio id="audioPlayer" src="assets/audio.wav" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
